<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vete To Go - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #FFD8A8; /* naranja pastel */
        }

        /* 👇 SOLO ESTO SE AGREGÓ */
        .navbar {
            background-color: #F4A261; /* naranja más fuerte */
        }

        .navbar .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .navbar .btn-outline-light {
            border-color: white;
            color: white;
        }

        .navbar .btn-outline-light:hover {
            background-color: white;
            color: #F4A261;
        }
        /* 👆 FIN DE LO AGREGADO */
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light">
  <div class="container">
    <a class="navbar-brand" href="index.html">🐾 Vete To Go</a>
    <div>
      <a class="btn btn-outline-light me-2" href="index.html">Login</a>
      <a class="btn btn-warning" href="register.html">Registrarse</a>
    </div>
  </div>
</nav>

<!-- LOGIN -->
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        
        <h4 class="text-center mb-4">Iniciar Sesión</h4>

        <form>
            <div class="mb-3">
                <label>Correo electrónico</label>
                <input type="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" class="form-control" required>
            </div>

            <button class="btn btn-dark w-100">Ingresar</button>
        </form>

    </div>
</div>

</body>
</html>
