<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vete To Go - Registro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #FFD8A8; /* naranja pastel */
        }

        /* Navbar personalizada */
        .navbar {
            background-color: #F4A261; /* naranja más fuerte */
        }

        .navbar .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .navbar .btn-outline-light {
            border-color: white;
            color: white;
        }

        .navbar .btn-outline-light:hover {
            background-color: white;
            color: #F4A261;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light">
  <div class="container">
    <a class="navbar-brand" href="index.html">🐾 Vete To Go</a>
    <div>
      <a class="btn btn-outline-light me-2" href="index.html">Login</a>
      <a class="btn btn-warning" href="register.html">Registrarse</a>
    </div>
  </div>
</nav>

<!-- REGISTRO -->
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 450px;">
        
        <h4 class="text-center mb-4">Crear Cuenta</h4>

        <form onsubmit="return validarPassword()">
            
            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Apellidos</label>
                <input type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Correo electrónico</label>
                <input type="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" class="form-control" required>
            </div>

            <!-- Botón cambiado para que combine -->
            <button class="btn w-100" style="background-color:#E76F51; color:white;">
                Registrarse
            </button>
        </form>

    </div>
</div>

<script>
function validarPassword() {
    let pass = document.getElementById("password").value;
    let confirm = document.getElementById("confirmPassword").value;

    if (pass !== confirm) {
        alert("Las contraseñas no coinciden");
        return false;
    }
    return true;
}
</script>

</body>
</html>
